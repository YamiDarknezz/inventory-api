# Production profile uses PostgreSQL (Neon recommended) and a real JWT secret from env vars.
spring.application.name=inventory-api

# Full JDBC URL wins; fall back to individual DB_* vars otherwise.
# Neon: use the "pooled" connection string (PgBouncer) and sslmode=require, e.g.
#   postgresql://user:pass@ep-xxx.pooler.region.aws.neon.tech/inventory?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory}?sslmode=require}
spring.datasource.username=${DB_USER:inventory}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

management.endpoints.web.exposure.include=health,info