name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compile and package
        run: ./mvnw -B package -DskipTests
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-api-jar
          path: target/inventory-api-0.1.0.jar
          retention-days: 7

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run tests with coverage gate (>=90% lines, >=70% branches)
        run: ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && !cancelled() && needs.test.result == 'success'
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: YamiDarknezz/darknezz-infra
      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@v1
        with:
          host: <VPS_IP>
          username: <USER>
          key: ${{ secrets.DEPLOY_KEY }}
          envs: INVENTORY_SHA
          script: |
            cd /home/<USER>/docker
            git pull --ff-only
            INVENTORY_SHA=$INVENTORY_SHA ./scripts/deploy.sh
            docker compose ps
        env:
          INVENTORY_SHA: ${{ github.sha }}